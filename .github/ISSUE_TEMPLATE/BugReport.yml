name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug", "triage"]
projects: ["DigiPen-GAM5xx/33"]
assignees:
  - octocat
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: contact
    attributes:
      label: Reporter
      description: What is your name?
      placeholder: ex. Jane Doe
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - 0.0.1 (Default)
      default: 0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: What OS and configuration are you seeing the problem on?
      multiple: true
      options:
        - Windows, 64-bit; Debug
        - Windows, 64-bit; Release
        - Windows, ARM; Debug
        - Windows, ARM; Release
        - Windows, 32-bit; Debug
        - Windows, 32-bit; Release
        - Windows, RISC-V; Debug
        - Windows, RISC-V; Release
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
